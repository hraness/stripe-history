  - id: origins-startup-school-decision
    date: 2009-10
    date_precision: month
    title: YC Startup School prompts the decision to build payments infrastructure
    summary: After attending Y Combinator's Startup School in Berkeley, Patrick and John Collison discussed the difficulty of accepting payments online. On the walk back from dinner, John argued that they should build a prototype themselves, turning Patrick's 'SliceHost for payments' idea into a concrete project.
