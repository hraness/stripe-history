    date: "2012"
    date_precision: year
    title: Early employees broaden Stripe's engineering and operating bench
    summary: Stripe continued to recruit unusually hands-on generalists after launch. Alex MacCaw joined after meeting John Collison through San Francisco's startup community, while Amber Feng joined as one of the company's first ten employees and went on to write much of the original Stripe Connect implementation.
    confidence: confirmed
