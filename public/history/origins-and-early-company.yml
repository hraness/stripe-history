  - id: origins-founders-go-full-time-and-first-hires-arrive
    date: 2010-09
    date_precision: month
    title: The founders go full time and the first hires arrive
    status: Approximate date, fall 2010
    summary: John Collison took leave from Harvard in fall 2010 to work on Stripe full time, joining Patrick Collison after his return to the project that summer. Darragh Buckley, a family friend from Limerick, became Stripe's first employee, while Harvard student Greg Brockman joined as an engineer and built foundational backend systems.
    confidence: reported
