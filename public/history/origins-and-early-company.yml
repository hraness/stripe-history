  - id: origins-users-become-early-engineers
    date: "2011"
    date_precision: year
    title: Product users become early engineers
    summary: Several early contributors arrived through the product itself or the founders' technical network. Ross Boucher, Stripe's first production user, and Saikat Chakrabarti pushed the API toward a RESTful design; Anurag Goel joined as the fifth engineer and later led risk.
