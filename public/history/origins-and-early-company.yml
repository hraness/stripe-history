  - id: origins-buenos-aires-prototype
    date: 2010-01
    date_precision: month
    title: A month in Buenos Aires produces Stripe's first working prototype
    summary: Patrick and John Collison spent the winter break in Buenos Aires building the prototype in cafés. Within roughly a week they had a production user, Ross Boucher at 280 North, even though the founders were still completing parts of the payment flow manually behind the scenes.
