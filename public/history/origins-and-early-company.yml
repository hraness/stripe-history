      - label: Ludwig Pettersson
        value: Stripe's first designer and an early teammate of Patrick and John Collison.
      - label: Benjamin De Cock
        value: Began contributing remotely after Ludwig contacted him in November 2011; the relationship eventually lasted eight years.
