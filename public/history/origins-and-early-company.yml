  - id: origins-first-design-cohort
    date: 2011-11
    date_precision: month
    title: Stripe's first design cohort takes shape
    summary: Ludwig Pettersson became Stripe's first designer as the company prepared and refined its public product. In November 2011 he contacted Belgian designer Benjamin De Cock, beginning a long-running collaboration that helped establish Stripe's visual and product-design language.
