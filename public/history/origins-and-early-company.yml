      - Harvard University
      - Massachusetts Institute of Technology
    details:
      - label: Darragh Buckley
        value: Stripe's first employee; he grew up in Limerick, his parents were friends with the Collisons, and he reconnected with them while studying in Boston.
      - label: Greg Brockman
        value: A Harvard student planning to transfer to MIT; he joined in 2010 and worked on Stripe's servers, card vault, recruiting, and engineering culture.
