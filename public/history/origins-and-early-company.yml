  - id: origins-brothers-enter-us-colleges
    date: 2009-09
    date_precision: month
    title: John begins at Harvard as Patrick returns to MIT
    summary: John Collison entered Harvard after completing Ireland's Leaving Certificate with top marks, while Patrick Collison returned to MIT after his post-acquisition period with Auctomatic in Vancouver. Their overlapping time in Cambridge set the stage for the payments project they began that academic year.
