        value: Former Twitter engineer and technical author; he later described meeting John at a housewarming party before joining Stripe.
      - label: Amber Feng
        value: Joined as one of Stripe's first ten employees and became an early builder of Stripe Connect and financial infrastructure.
    metrics:
      - label: Team size six months after launch
        value: 23 people
        context: Patrick Collison's 2012 Startup Grind interview compared this with roughly eight people at launch.
