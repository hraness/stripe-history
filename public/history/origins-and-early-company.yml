  - id: origins-auctomatic-acquired
    date: 2008-03-26
    date_precision: day
    title: Live Current Media acquires Auctomatic
    summary: Live Current Media, then named Communicate.com, acquired Auctomatic about ten months after the company was formed. The reported consideration was $5 million in cash and stock, giving Patrick and John Collison an early exit before either had completed college.
