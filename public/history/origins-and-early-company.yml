  - id: origins-shuppa-merges-into-auctomatic
    date: 2007-05
    date_precision: month
    title: Shuppa merges with another YC team to form Auctomatic
    summary: Patrick and John Collison entered Y Combinator with Shuppa, an idea for easier online selling. At Paul Graham's suggestion they combined forces with Harjeet and Kulveer Taggar, forming Auctomatic to build tools for high-volume eBay sellers.
