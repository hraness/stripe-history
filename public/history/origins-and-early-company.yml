  - id: origins-stripe-public-launch
    date: 2011-09-30
    date_precision: day
    title: Stripe launches publicly
    summary: After roughly a year spent rebuilding the infrastructure behind its prototype, Stripe opened its developer-focused payments product to the public. The launch team was about eight people, and Patrick Collison later said four or five had first encountered Stripe as users.
    confidence: confirmed
