  - id: origins-devpayments-becomes-stripe
    date: 2011-01
    date_precision: month
    title: DevPayments becomes Stripe
    summary: The company initially incorporated as SlashDevSlashFinance and called its product SlashDevSlashPayments at devpayments.com. With only about five customers, the founders adopted the short name Stripe and bought stripe.com for an amount Patrick Collison later recalled as between $10,000 and $20,000.
