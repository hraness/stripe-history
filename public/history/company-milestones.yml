  - id: milestone-2026-ftc-debanking-warning
    title: FTC chairman sends Stripe a warning letter about potential debanking violations
    date: 2026-03-26
    date_precision: day
    confidence: confirmed
    status: warning; no finding or enforcement action stated
    summary: The Federal Trade Commission chairman warned Stripe and three other payment companies that denying lawful customers service inconsistently with their terms or reasonable expectations could violate the FTC Act.
    details:
      - label: Action type
        value: Warning letter from the FTC chairman
      - label: Legal framing
        value: Potential violations related to debanking under Section 5 of the FTC Act
      - label: Scope caution
        value: The letter raised concerns and possible consequences; it did not announce a factual finding, investigation result, or penalty
      - label: Other recipients
        value: PayPal, Visa, and Mastercard
    people:
