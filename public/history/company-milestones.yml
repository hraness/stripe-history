  - id: milestone-2022-workforce-reduction
    title: Stripe announces a 14% workforce reduction
    date: 2022-11-03
    date_precision: day
    confidence: confirmed
    status: restructuring announced
    summary: Patrick Collison told employees that Stripe would reduce its team by about 14%, saying the founders had overhired after pandemic-era ecommerce growth.
    details:
      - label: Reason given
        value: Costs and staffing had been built for a faster-growth environment than Stripe expected in 2022 and 2023
      - label: Founder accountability
        value: Patrick and John Collison said they were fully responsible for the decisions leading to the reduction
      - label: Severance floor
        value: At least 14 weeks, with more for longer tenure
    metrics:
      - label: Workforce reduction
        value: About 14%
      - label: Pandemic-era growth
        value: 3x+
        context: Stripe's stated revenue and payment-volume growth since the pandemic began
    people:
