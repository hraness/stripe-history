      - Patrick Collison
      - John Collison
    organizations:
      - Stripe
    details:
      - label: Greg Brockman's focus
        value: Technical direction, critical systems, recruiting, and organizational leverage rather than all engineering management.
      - label: Marc Hedlund's focus
        value: Engineering line management, including one-to-ones and team execution.
