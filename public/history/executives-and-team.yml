    title: Eileen O'Mara becomes vice chair and Tyler Bryson becomes chief revenue officer
    summary: Stripe moved Eileen O'Mara from chief revenue officer to vice chair, with a remit spanning long-range partnerships, strategic investments, and the company's global footprint. Tyler Bryson, who had joined Stripe in 2025 after more than two decades at Microsoft, succeeded her as chief revenue officer.
