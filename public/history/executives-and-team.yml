  - id: executives-first-cto-and-vp-engineering-roles
    date: "2014"
    date_precision: year
    title: Greg Brockman defines the CTO role and Marc Hedlund takes engineering management
    summary: Early engineer Greg Brockman had become Stripe's first chief technology officer by roughly 2013, but found that the title obscured several different jobs. By 2014 he had recruited Marc Hedlund as vice president of engineering and handed over line management while retaining responsibility for technical direction and key systems.
    confidence: confirmed
    people:
