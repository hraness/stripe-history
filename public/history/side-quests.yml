    date: 2026-08-24
    date_precision: day
    title: Patrick Collison and Mario Draghi launch the Rhine Group
    summary: Patrick Collison and Mario Draghi launched the Rhine Group as a European competitiveness forum, with Luis Garicano as executive director. The group is not a Stripe product or official Stripe initiative. It convenes government, academic, and business leaders using research pre-reads and Chatham House Rule, and aims to turn the 2024 Draghi competitiveness report into a concrete reform agenda.
