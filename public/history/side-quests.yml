  - id: side-quest-arc-institute-launches
    date: 2021-12-15
    date_precision: day
    title: Patrick Collison co-founds Arc Institute
    summary: Patrick Collison, Patrick Hsu, and Silvana Konermann launched Arc Institute as an independent biomedical research organization focused on complex human disease. Its model gives core investigators renewable eight-year funding, while Patrick and John Collison are listed among the institute's founding donors.
