    date: 2026-05-25
    date_precision: day
    title: Patrick Collison and Tyler Cowen award 28 New Aesthetics grants
    summary: Patrick Collison and Tyler Cowen published the recipients of their New Aesthetics grants after receiving more applications than expected. They funded 28 artists and projects spanning architecture, publishing, craft, software, film, furniture, public art, and experimental technology.
