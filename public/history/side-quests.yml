  - id: side-quest-progress-studies-proposal
    date: 2019-07-30
    date_precision: day
    title: Patrick Collison and Tyler Cowen propose progress studies
    summary: Patrick Collison and economist Tyler Cowen argued for a focused discipline studying how economic, technological, scientific, cultural, and organizational progress happens. The essay supplied a name and research agenda for a broader movement concerned with increasing society's capacity to produce useful advances.
