    status: Agreement announced; completion not reported
    summary: Stripe announced an agreement to acquire OpenRouter, an AI model gateway that routes requests across more than 400 models from more than 80 providers. Official terms were not disclosed. OpenRouter said the transaction remained subject to customary closing conditions and was expected to close in the coming weeks. A same-day investor letter, later published by Eric Newcomer and verified by TechCrunch, told investors that OpenRouter would join as Stripe's largest-ever acquisition.
