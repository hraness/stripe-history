    status: Index introduced; updates planned
    summary: Stripe Economics introduced the Stripe SaaS Index, a weekly same-business measure based on pay-in volumes processed through Stripe for non-AI SaaS companies. Its flagship aggregate index covered an average of 72,000 businesses per week in 2026 to date. The publication said it would host and update the indices online.
