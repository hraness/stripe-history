    mechanism: internal-409a
    status: retrospective
    confidence: reported
    valuation:
      currency: USD
      display: ~$70.8 billion
      qualifier: approximate
      value_usd: 70800000000
      precision: inferred
      basis: common-stock-409a
    share_price:
      currency: USD
      display: $27.73
      qualifier: exact
      value_usd: 27.73
    derivation:
      formula: $74 billion × $27.73 ÷ $29, rounded to one decimal billion
      inputs:
        - label: July 2022 internal valuation
          value: $74 billion
        - label: July 2022 share price
          value: $29
        - label: October 2022 share price
          value: $27.73
    notes: The estimate assumes the diluted share count did not change between the July and October 409A marks.
    source_ids:
      - source-03f4b7ce98afc255b0ba
      - source-67de5aa3b7009ba5ed83
      - source-be63a33e896357893bf6
