    dataset: appearances
    scope: Reviewed public appearances by Patrick Collison or John Collison that contain first-person evidence about Stripe, its predecessors, or its operating history.
    coverage:
      basis: occurred-at
      from: '2008'
      through: 2026-08-12
    output_files:
      - research/appearances.yml
    input_source_ids:
      - source-001e51b689b259d0b4e3
