schema: stripe-history/research-collections/v1
mutable_sources:
  - canonical_url: https://stripe.com/blog/changelog
    capture_evidence:
      capture_slug: stripe-changelog-snapshot-2026-08-12
      captured_on: 2026-08-12
      evidence_path: evidence/source.html
      sha256: e76e5b49f491c89aacc88ff4feb135568d06769e81b82c5dbdf2c7e19f0a2505
      status: complete
    policy: date-stamped-snapshots
    rationale: The changelog URL is mutable, so each historical claim is keyed to its stated month and retained as a separate dated snapshot.
    source_ids:
      - source-2186a9fb2e4e200518a1
      - source-95839ee4456a7ec1910e
      - source-a5244f067a61333806ae
      - source-bebcca96578a064a18b0
      - source-e8c3c01525fe68d64c99
collections:
