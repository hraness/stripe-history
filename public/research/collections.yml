      - source-ca9f69ba263dbc27bda3
      - source-d8e4c6cb20568d496b94
    supporting_source_ids: []
    discovery_sources:
      - https://www.youtube.com/@stripe
      - https://www.youtube.com/@ycombinator
      - https://www.dwarkeshpatel.com/p/patrick-collison
      - https://stripe.com/sessions
    query_families:
      - 'site:youtube.com Patrick Collison interview Stripe'
      - 'site:youtube.com John Collison interview Stripe'
      - 'Patrick Collison transcript Stripe founding Auctomatic'
      - 'John Collison transcript Stripe early employees product history'
      - 'Patrick Collison testimony Stripe transcript'
      - 'Stripe Sessions Patrick Collison John Collison keynote AMA'
    authority_order: [primary, interview, reporting, archive]
    dedupe_keys:
      - native-id
      - canonical-url-published-at
      - appearance-participants-venue-occurred-at
      - semantic-claim
    capture_policy: primary-and-claim-critical
    refresh:
      cadence: quarterly
      mode: incremental-discovery
      lookback_days: 120
      minimum_request_interval_ms: 1000
