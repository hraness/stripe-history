schema: stripe-history/news-monitors/v1
lookback_days: 8
max_candidates: 100
max_items_per_monitor: 40
minimum_request_interval_ms: 1000
monitors:
  - id: stripe-newsroom
    kind: html-index
    url: https://stripe.com/newsroom
    link_path_prefixes:
      - /newsroom/news/
    research_areas:
      - company-history
      - sessions-product-launches
      - valuation-history
  - id: stripe-blog
    kind: html-index
    url: https://stripe.com/blog
    link_path_prefixes:
      - /blog/
    research_areas:
      - company-history
      - sessions-product-launches
  - id: stripe-economics
    kind: rss
    url: https://www.stripeeconomics.com/feed
    research_areas:
      - publishing
      - company-history
  - id: works-in-progress-newsletter
    kind: rss
    url: https://www.worksinprogress.news/feed
    research_areas:
      - publishing
      - company-history
  - id: stripe-press-newsletter
    kind: rss
    url: https://stripepress.substack.com/feed
    research_areas:
      - publishing
      - company-history
  - id: techcrunch-stripe
    kind: rss
    url: https://techcrunch.com/tag/stripe/feed/
    research_areas:
      - company-history
      - valuation-history
  - id: techcrunch-latest
    kind: rss
    url: https://techcrunch.com/feed/
    include_terms:
      - Stripe
      - OpenRouter
    research_areas:
      - company-history
      - valuation-history
  - id: exa-stripe-reporting
    kind: exa-search
    query: Recent material Stripe company news about acquisitions, signed deals, product launches, leadership, funding, valuation, geographic expansion, or payment infrastructure
    title_any_terms:
      - Stripe
      - Patrick Collison
      - John Collison
    include_domains:
      - bloomberg.com
      - cnbc.com
      - ft.com
      - reuters.com
      - stripe.com
      - stripeeconomics.com
      - stripepress.substack.com
      - techcrunch.com
      - theinformation.com
      - worksinprogress.co
      - worksinprogress.news
      - wsj.com
    research_areas:
      - company-history
      - sessions-product-launches
      - valuation-history
  - id: exa-stripe-leadership-appearances
    kind: exa-search
    category: null
    query: Long-form podcast, video interview, keynote, fireside chat, or testimony featuring a Stripe founder or senior executive discussing Stripe's products, company building, strategy, technology, commerce, or operating history
    title_terms_from_history_category: executives-and-team
    include_domains:
      - a16z.com
      - colossus.com
      - ecorner.stanford.edu
      - newcomer.co
      - podcasts.apple.com
      - spotify.com
      - stripe.com
      - tim.blog
      - youtube.com
      - youtu.be
    research_areas:
      - founder-appearances
  - id: exa-founder-side-projects
    kind: exa-search
    query: Recent news about Patrick Collison or John Collison launching, chairing, funding, or joining a project, institute, grant program, board, forum, or think tank outside Stripe, including European competitiveness or progress-studies work
    title_any_terms:
      - Patrick Collison
      - John Collison
      - Rhine Group
    include_domains:
      - bloomberg.com
      - businesspost.ie
      - euronews.com
      - ft.com
      - marginalrevolution.com
      - reuters.com
      - rhinegroup.eu
      - techcrunch.com
      - theinformation.com
      - wsj.com
    research_areas:
      - founder-side-projects
  - id: marginal-revolution-founders
    kind: rss
    url: https://marginalrevolution.com/feed
    include_terms:
      - Stripe
      - Patrick Collison
      - John Collison
    research_areas:
      - founder-appearances
      - founder-side-projects
  - id: gdelt-stripe
    kind: gdelt
    query: '"Stripe" sourcelang:english'
    title_any_terms:
      - Stripe
    title_context_terms:
      - acquisition
      - acquire
      - appoint
      - bank
      - billing
      - billion
      - checkout
      - Collison
      - commerce
      - crypto
      - deal
      - executive
      - expand
      - financial
      - fintech
      - fund
      - launch
      - merchant
      - million
      - officer
      - OpenRouter
      - payment
      - PayPal
      - product
      - revenue
      - Sessions
      - stablecoin
      - subscription
      - tax
      - tender
      - valuation
      - volume
    research_areas:
      - company-history
      - sessions-product-launches
      - valuation-history
  - id: gdelt-founders
    kind: gdelt
    query: '("Patrick Collison" OR "John Collison") sourcelang:english'
    title_any_terms:
      - Patrick Collison
      - John Collison
    research_areas:
      - founder-appearances
      - founder-side-projects
  - id: gdelt-founder-side-projects
    kind: gdelt
    query: '("Patrick Collison" OR "John Collison" OR "Rhine Group")'
    title_any_terms:
      - Patrick Collison
      - John Collison
      - Rhine Group
    research_areas:
      - founder-side-projects
