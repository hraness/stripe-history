name: Production site browser
on:
  workflow_dispatch:
  # Vercel reports each deployment through the Deployments API. Check Production
  # as soon as it is live instead of waiting for someone to dispatch this run.
  # deployment_status runs the workflow file at the deployment's sha, so this
  # relies on Vercel Git Fork Protection staying on (no fork preview builds).
  deployment_status:
permissions:
  contents: read
# One run per deployed commit; a later deployment never cancels an earlier check.
# A manual dispatch for the same commit queues behind the deployment_status run
# (and replaces any still-pending duplicate) instead of running beside it.
concurrency:
  group: production-site-browser-${{ github.sha }}
  cancel-in-progress: false
jobs:
  browser:
    # Preview deployments also emit deployment_status on PR heads. Skip them
    # here and in the aggregate so this workflow never reports on a PR head.
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-site-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-site-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: site-chromium-${{ runner.os }}-1.62.0
      - name: Install Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Check public pages in a browser
        env:
          SITE_BROWSER_ARTIFACTS: ${{ runner.temp }}/site-browser
        run: node scripts/verify-site-browser.mjs --production
      - name: Save public page screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-site-browser
          path: ${{ runner.temp }}/site-browser
          retention-days: 7

  production-browser:
    # Not named Required: the pull request gate must never read this result.
    name: Production browser
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'))
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the production browser result
        env:
          RESULT: ${{ needs.browser.result }}
        run: test "$RESULT" = success
