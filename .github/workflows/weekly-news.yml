name: Weekly history publication

on:
  schedule:
    - cron: "17 9 * * 4"
      timezone: America/Puerto_Rico
  workflow_dispatch:
    inputs:
      as_of:
        description: Optional YYYY-MM-DD research date
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-history-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run history:research:audit
      - id: digest
        name: Pull latest news
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        run: |
          as_of="${REQUESTED_AS_OF:-$(date -u +%F)}"
          bun run history:news:pull -- --as-of "$as_of" --json-out weekly-news/latest-news.json --markdown-out weekly-news/latest-news.md
          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"
          echo "candidate_count=$(jq '.candidates | length' weekly-news/latest-news.json)" >> "$GITHUB_OUTPUT"
      - id: model
        name: Decide and compile history changes
        continue-on-error: true
        env:
          STRIPE_HISTORY_LLM_API_KEY: ${{ secrets.STRIPE_HISTORY_LLM_API_KEY }}
        run: bun run history:publish:auto -- --digest weekly-news/latest-news.json --write --json-out weekly-news/publication.json --markdown-out weekly-news/publication.md --review-out weekly-news/review-queue.md
      - id: review
        name: Resolve durable changes and review queue
        if: always()
        run: |
          candidate_count='${{ steps.digest.outputs.candidate_count }}'
          if [ '${{ steps.digest.outcome }}' != 'success' ]; then
            published=0
            actionable=1
            infrastructure_errors=1
            {
              echo '# Stripe history research review queue'
              echo
              echo 'News discovery failed before it could produce a candidate digest. Review the workflow logs.'
            } > weekly-news/review-queue.md
          elif [ -f weekly-news/publication.json ]; then
            published="$(jq '.published' weekly-news/publication.json)"
            actionable="$(jq '(.unresolved // [.decisions[] | select(.outcome == "needs-review" or .outcome == "deferred" or .outcome == "infrastructure-error")]) | length' weekly-news/publication.json)"
            infrastructure_errors="$(jq '(.unresolved // .decisions) | map(select(.outcome == "infrastructure-error")) | length' weekly-news/publication.json)"
          elif [ "${candidate_count:-0}" != '0' ]; then
            published=0
            actionable="$candidate_count"
            infrastructure_errors=1
            {
              echo '# Stripe history research review queue'
              echo
              echo 'The automatic decision step failed before it could produce a structured report. Review the attached discovery artifact and the workflow logs.'
              echo
              if [ -f weekly-news/latest-news.md ]; then cat weekly-news/latest-news.md; fi
            } > weekly-news/review-queue.md
          else
            published=0
            actionable=0
            infrastructure_errors=0
          fi
          durable_changes=false
          if ! git diff --quiet; then durable_changes=true; fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "actionable=$actionable" >> "$GITHUB_OUTPUT"
          echo "infrastructure_errors=$infrastructure_errors" >> "$GITHUB_OUTPUT"
          echo "durable_changes=$durable_changes" >> "$GITHUB_OUTPUT"
      - id: scope
        name: Verify generated diff scope
        if: steps.model.outcome == 'success' && steps.review.outputs.durable_changes == 'true'
        run: |
          test -z "$(git diff --name-only --diff-filter=D)"
          changed="$(git diff --name-only)"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(public/history/(origins-and-early-company|executives-and-team|acquisitions|product-launches|country-expansion|payment-and-payout-expansion|fundraising|headquarters-and-offices|publishing|company-milestones)\.yml|public/research/(sources|automated-decisions|automated-publications)\.yml)$' || true)"
          test -z "$unexpected"
          printf '%s\n' "$changed" | grep -Fx 'public/research/automated-decisions.yml'
          if [ '${{ steps.review.outputs.published }}' != '0' ]; then
            printf '%s\n' "$changed" | grep -Fx 'public/research/sources.yml'
            printf '%s\n' "$changed" | grep -Fx 'public/research/automated-publications.yml'
          fi
          test "$(printf '%s\n' "$changed" | wc -l)" -le 5
      - id: validate
        name: Validate generated history
        if: steps.model.outcome == 'success' && steps.review.outputs.durable_changes == 'true'
        run: |
          bun run history:research:audit
          bun run check
          bun run build
      - id: push
        name: Commit and fast-forward push
        if: steps.model.outcome == 'success' && steps.review.outputs.durable_changes == 'true'
        run: |
          git add public/history public/research/sources.yml public/research/automated-decisions.yml public/research/automated-publications.yml
          git diff --cached --check
          git config user.name "stripehistory-research[bot]"
          git config user.email "stripehistory-research[bot]@users.noreply.github.com"
          git commit -m "chore(history): publish weekly research ${{ steps.digest.outputs.as_of }}"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Add reports to job summary
        if: always()
        run: |
          if [ -f weekly-news/publication.md ]; then
            sed -n '1,500p' weekly-news/publication.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f weekly-news/latest-news.md ]; then
            sed -n '1,500p' weekly-news/latest-news.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-news-${{ steps.digest.outputs.as_of || github.run_id }}
          path: weekly-news/
          if-no-files-found: ignore
          retention-days: 30
      - name: Create or refresh rolling review issue
        if: >-
          always()
          && (steps.review.outputs.actionable != '0'
            || steps.scope.outcome == 'failure'
            || steps.validate.outcome == 'failure'
            || steps.push.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: Stripe history research review queue
        run: |
          body=weekly-news/review-queue.md
          if [ '${{ steps.scope.outcome }}' = 'failure' ] || [ '${{ steps.validate.outcome }}' = 'failure' ] || [ '${{ steps.push.outcome }}' = 'failure' ]; then
            issue_body=weekly-news/review-issue.md
            cp "$body" "$issue_body"
            {
              echo
              echo '## Workflow delivery failure'
              echo
              echo 'The decision report could not be validated, committed, or pushed. Review the workflow logs before resolving this queue.'
              echo
              echo 'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            } >> "$issue_body"
            body="$issue_body"
          fi
          issue_number="$(gh issue list --repo "$GH_REPO" --state all --search "$ISSUE_TITLE in:title" --limit 100 --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$GH_REPO" --body-file "$body"
            gh issue reopen "$issue_number" --repo "$GH_REPO" || true
          else
            gh issue create --repo "$GH_REPO" --title "$ISSUE_TITLE" --body-file "$body"
          fi
      - name: Close an empty rolling review issue
        if: >-
          always()
          && steps.digest.outcome == 'success'
          && steps.model.outcome == 'success'
          && steps.review.outputs.actionable == '0'
          && steps.scope.outcome != 'failure'
          && steps.validate.outcome != 'failure'
          && steps.push.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: Stripe history research review queue
        run: |
          issue_number="$(gh issue list --repo "$GH_REPO" --state open --search "$ISSUE_TITLE in:title" --limit 100 --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then gh issue close "$issue_number" --repo "$GH_REPO"; fi
      - name: Fail when automatic publication was unavailable
        if: >-
          always()
          && (steps.model.outcome == 'failure'
            || steps.review.outputs.infrastructure_errors != '0')
        run: exit 1
