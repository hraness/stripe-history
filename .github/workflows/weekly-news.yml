name: Weekly news research

on:
  schedule:
    - cron: "17 9 * * 4"
      timezone: America/Puerto_Rico
  workflow_dispatch:
    inputs:
      as_of:
        description: Optional YYYY-MM-DD research date
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-news-research
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run history:research:audit
      - id: digest
        name: Pull latest news
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        run: |
          as_of="${REQUESTED_AS_OF:-$(date -u +%F)}"
          bun run history:news:pull -- --as-of "$as_of" --json-out weekly-news/latest-news.json --markdown-out weekly-news/latest-news.md
          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"
          echo "candidate_count=$(jq '.candidates | length' weekly-news/latest-news.json)" >> "$GITHUB_OUTPUT"
      - name: Add digest to job summary
        if: always() && hashFiles('weekly-news/latest-news.md') != ''
        run: sed -n '1,500p' weekly-news/latest-news.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-news-${{ steps.digest.outputs.as_of || github.run_id }}
          path: weekly-news/
          if-no-files-found: ignore
          retention-days: 30
      - name: Create or refresh review issue
        if: steps.digest.outputs.candidate_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: Weekly Stripe history research - ${{ steps.digest.outputs.as_of }}
        run: |
          issue_number="$(gh issue list --repo "$GH_REPO" --state all --search "$ISSUE_TITLE in:title" --limit 100 --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$GH_REPO" --body-file weekly-news/latest-news.md
          else
            gh issue create --repo "$GH_REPO" --title "$ISSUE_TITLE" --body-file weekly-news/latest-news.md
          fi
