name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run build
      - name: Install Chromium for public layout checks
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Check public layouts
        env:
          SITE_BROWSER_ARTIFACTS: ${{ runner.temp }}/site-browser
        run: node scripts/verify-site-browser.mjs
      - name: Save public layout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-browser
          path: ${{ runner.temp }}/site-browser
          retention-days: 7
      - run: git diff --exit-code

  required:
    name: Required
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every blocking job
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
