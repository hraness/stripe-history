name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull request runs supersede each other. Main and dispatched runs are grouped
# by commit, so a later push or rerun never cancels an earlier commit's result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two tests spawn genuine Node 24 to prove the config loader and patch.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check Ubuntu mirror fixtures
        run: python3 scripts/ci-ubuntu-mirror.test.py
      - run: bun run check
      - run: git diff --exit-code

  site:
    # The timeline is far longer than any other page, and its two states take as
    # long as all the others together, so they get a job of their own.
    # scripts/deliver-weekly-history.ts names these jobs too.
    name: Build and browser layouts (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [pages, timeline]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      # The Chromium build follows the installed playwright-core, so the cache key
      # does too. Pull requests only restore it; main saves it.
      - id: chromium
        name: Name the pinned Chromium
        # On a line of its own, so the step fails if node can't read the version.
        run: |
          version=$(node -p 'require("playwright-core/package.json").version')
          echo "key=site-chromium-$RUNNER_OS-$version" >> "$GITHUB_OUTPUT"
      - id: chromium-cache
        name: Restore Chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium.outputs.key }}
      # Only the layout check needs Chromium. Install it (apt deps plus the
      # browser download) while Next builds, and check its exit status before use.
      - name: Start the Chromium install in the background
        shell: bash
        run: |
          set -euo pipefail
          # Helper and fixtures copied from hraness/ui at 07feaf58c57938f6a7368d7c10d1a8e05d3985a0.
          sudo python3 scripts/ci-ubuntu-mirror.py
          sudo tee /etc/apt/apt.conf.d/99hraness-browser-acquisition >/dev/null <<'APT'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "1";
          APT
          sudo apt-config shell HRANESS_APT_HTTP_TIMEOUT Acquire::http::Timeout HRANESS_APT_HTTPS_TIMEOUT Acquire::https::Timeout HRANESS_APT_RETRIES Acquire::Retries
          (
            install_status=0
            # TERM at 295 s plus a 5 s kill grace bounds the full install to 300 s.
            timeout --kill-after=5s 295s node node_modules/playwright-core/cli.js install --with-deps chromium > "$RUNNER_TEMP/chromium-install.log" 2>&1 || install_status=$?
            printf '%s\n' "$install_status" > "$RUNNER_TEMP/chromium-install.rc.tmp"
            mv "$RUNNER_TEMP/chromium-install.rc.tmp" "$RUNNER_TEMP/chromium-install.rc"
          ) &
      - run: bun run build
      - name: Finish the Chromium install
        run: |
          started=$SECONDS
          while [ ! -f "$RUNNER_TEMP/chromium-install.rc" ]; do
            if [ $((SECONDS - started)) -ge 300 ]; then
              echo "::error::Chromium install did not finish within 300 s"
              cat "$RUNNER_TEMP/chromium-install.log"
              exit 1
            fi
            sleep 1
          done
          echo "Waited $((SECONDS - started)) s for the background install."
          cat "$RUNNER_TEMP/chromium-install.log"
          test "$(cat "$RUNNER_TEMP/chromium-install.rc")" = 0
      - name: Save Chromium from main
        if: matrix.part == 'pages' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium.outputs.key }}
      # ra looks at states in ra.config.ts through `next start`, in the Chromium
      # build playwright-core pins, and keeps its pictures in .ra/check. The
      # timeline job takes the timeline's two states and the pages job every other
      # state, so a new state is checked here without a change to this file.
      - name: Check public layouts
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          timeline=$'timeline\nyear-jump'
          if [ "$PART" = timeline ]; then
            names=$timeline
          else
            names=$(node node_modules/@hraness/ra/dist/cli.js states --json | jq -r --arg skip "$timeline" '($skip | split("\n")) as $skip | .[].name | select(IN($skip[]) | not)')
          fi
          # With no names, ra would check every state.
          test -n "$names"
          mapfile -t states <<<"$names"
          echo "States: ${states[*]}"
          bun run ra check "${states[@]}"
      - name: Save public layout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-browser-${{ matrix.part }}
          path: .ra/check
          include-hidden-files: true
          retention-days: 7
      - run: git diff --exit-code

  required:
    name: Required
    if: always()
    needs: [static, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every blocking job
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          SITE_RESULT: ${{ needs.site.result }}
        run: test "$STATIC_RESULT" = success && test "$SITE_RESULT" = success
