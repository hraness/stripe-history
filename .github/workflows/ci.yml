name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull request runs supersede each other. Main and dispatched runs are grouped
# by commit, so a later push or rerun never cancels an earlier commit's result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two tests spawn genuine Node 24 to prove the config loader and patch.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check Ubuntu mirror fixtures
        run: python3 scripts/ci-ubuntu-mirror.test.py
      - run: bun run check
      - run: git diff --exit-code

  site:
    name: Build and browser layouts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      # Only the layout check needs Chromium. Install it (apt deps plus the
      # browser download) while Next builds, and check its exit status before use.
      - name: Start the Chromium install in the background
        shell: bash
        run: |
          set -euo pipefail
          # Helper and fixtures copied from hraness/ui at 07feaf58c57938f6a7368d7c10d1a8e05d3985a0.
          sudo python3 scripts/ci-ubuntu-mirror.py
          sudo tee /etc/apt/apt.conf.d/99hraness-browser-acquisition >/dev/null <<'APT'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "1";
          APT
          sudo apt-config shell HRANESS_APT_HTTP_TIMEOUT Acquire::http::Timeout HRANESS_APT_HTTPS_TIMEOUT Acquire::https::Timeout HRANESS_APT_RETRIES Acquire::Retries
          (
            install_status=0
            # TERM at 295 s plus a 5 s kill grace bounds the full install to 300 s.
            timeout --kill-after=5s 295s node node_modules/playwright-core/cli.js install --with-deps chromium > "$RUNNER_TEMP/chromium-install.log" 2>&1 || install_status=$?
            printf '%s\n' "$install_status" > "$RUNNER_TEMP/chromium-install.rc.tmp"
            mv "$RUNNER_TEMP/chromium-install.rc.tmp" "$RUNNER_TEMP/chromium-install.rc"
          ) &
      - run: bun run build
      - name: Finish the Chromium install
        run: |
          started=$SECONDS
          while [ ! -f "$RUNNER_TEMP/chromium-install.rc" ]; do
            if [ $((SECONDS - started)) -ge 300 ]; then
              echo "::error::Chromium install did not finish within 300 s"
              cat "$RUNNER_TEMP/chromium-install.log"
              exit 1
            fi
            sleep 1
          done
          echo "Waited $((SECONDS - started)) s for the background install."
          cat "$RUNNER_TEMP/chromium-install.log"
          test "$(cat "$RUNNER_TEMP/chromium-install.rc")" = 0
      - name: Check public layouts
        env:
          SITE_BROWSER_ARTIFACTS: ${{ runner.temp }}/site-browser
        run: node scripts/verify-site-browser.mjs
      - name: Save public layout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-browser
          path: ${{ runner.temp }}/site-browser
          retention-days: 7
      - run: git diff --exit-code

  required:
    name: Required
    if: always()
    needs: [static, site]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require every blocking job
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          SITE_RESULT: ${{ needs.site.result }}
        run: test "$STATIC_RESULT" = success && test "$SITE_RESULT" = success
