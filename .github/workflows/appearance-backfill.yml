name: Leadership appearance backfill

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: First publication date to review (YYYY-MM-DD)
        required: true
        default: "2009-01-01"
        type: string
      through_date:
        description: Last publication date to review; defaults to today (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: leadership-appearance-backfill
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run history:research:audit
      - name: Search bounded yearly windows
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          REQUESTED_FROM: ${{ inputs.from_date }}
          REQUESTED_THROUGH: ${{ inputs.through_date }}
        run: |
          set -euo pipefail
          from_date="$REQUESTED_FROM"
          through_date="${REQUESTED_THROUGH:-$(date -u +%F)}"
          test "$(date -u -d "$from_date" +%F)" = "$from_date"
          test "$(date -u -d "$through_date" +%F)" = "$through_date"
          [[ "$from_date" < "$through_date" || "$from_date" == "$through_date" ]]
          test "${from_date%%-*}" -ge 2009
          test "$(( ${through_date%%-*} - ${from_date%%-*} ))" -le 25

          mkdir -p appearance-backfill
          {
            echo '# Stripe leadership appearance backfill'
            echo
            echo "Review window: $from_date through $through_date."
            echo
            echo 'These are discovery candidates, not accepted records. Capture and review the full source before adding an appearance.'
            echo
          } > appearance-backfill/review.md

          cursor="$from_date"
          while [[ "$cursor" < "$through_date" || "$cursor" == "$through_date" ]]; do
            year="${cursor%%-*}"
            year_end="$year-12-31"
            if [[ "$year_end" > "$through_date" ]]; then year_end="$through_date"; fi
            window_from="$cursor"
            window_through="$year_end"
            bun run history:news:pull -- \
              --from "$window_from" \
              --as-of "$window_through" \
              --monitor exa-stripe-leadership-appearances \
              --json-out "appearance-backfill/$year.json" \
              --markdown-out "appearance-backfill/$year.md"
            {
              echo "## $window_from through $window_through"
              echo
              sed -n '/^## Review queue/,/^## Research watermarks/p' "appearance-backfill/$year.md" | sed '$d'
              echo
            } >> appearance-backfill/review.md
            cursor="$((year + 1))-01-01"
          done

          sed -n '1,1000p' appearance-backfill/review.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leadership-appearance-backfill-${{ github.run_id }}
          path: appearance-backfill/
          if-no-files-found: error
          retention-days: 30
